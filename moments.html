<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 朋友圈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 22px; color: #333; }
        .back-btn {
            text-decoration: none;
            color: #07c160;
            font-size: 16px;
            padding: 6px 12px;
            border: 1px solid #07c160;
            border-radius: 20px;
        }
        .publish-area {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .publish-area textarea {
            width: 100%;
            border: none;
            resize: none;
            font-size: 15px;
            padding: 8px 0;
            outline: none;
            min-height: 60px;
            font-family: inherit;
        }
        .publish-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .publish-bottom input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
            outline: none;
            margin-right: 10px;
        }
        .publish-bottom button {
            background: #07c160;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .publish-bottom button:active { opacity: 0.7; }

        /* 动态卡片 */
        .moment-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #07c160;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 10px;
        }
        .user-name { font-weight: 600; color: #333; }
        .user-time { font-size: 12px; color: #999; margin-top: 2px; }
        .moment-text { font-size: 15px; line-height: 1.6; color: #222; margin-bottom: 10px; }
        .moment-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
            background: #f0f0f0;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #f0f0f0;
            padding-top: 12px;
            margin-top: 4px;
        }
        .action-bar span {
            font-size: 15px;
            color: #666;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-bar span:active { opacity: 0.6; }
        .action-bar .liked { color: #ee0a24; font-weight: 600; }

        .comment-section {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 12px;
        }
        .comment-item {
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px dashed #e8e8e8;
            color: #333;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .comment-input-group input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 5px 14px;
            font-size: 14px;
            outline: none;
            background: white;
        }
        .comment-input-group button {
            background: #07c160;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 5px 16px;
            font-size: 13px;
            cursor: pointer;
        }
        .empty-tip {
            text-align: center;
            color: #bbb;
            padding: 60px 0;
            font-size: 16px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📱 朋友圈</h1>
        <a href="https://evan02-11.github.io/chat/" class="back-btn">回聊天</a>
    </div>

    <!-- 发布区 -->
    <div class="publish-area">
        <textarea id="postContent" placeholder="分享你的新鲜事..."></textarea>
        <div class="publish-bottom">
            <input id="postImage" placeholder="图片链接 (可选)" />
            <button onclick="addMoment()">发布</button>
        </div>
    </div>

    <!-- 动态列表 -->
    <div id="feedList"></div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== 核心逻辑 ==========
        function getData() {
            try {
                return JSON.parse(localStorage.getItem('moments_data') || '[]');
            } catch { return []; }
        }

        function saveData(data) {
            localStorage.setItem('moments_data', JSON.stringify(data));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.style.display = 'none', 1500);
        }

        function render() {
            const list = document.getElementById('feedList');
            const data = getData();
            if (data.length === 0) {
                list.innerHTML = '<div class="empty-tip">🌱 还没有动态，发一条吧</div>';
                return;
            }
            let html = '';
            data.forEach((item, index) => {
                const likeCount = item.likes || 0;
                const liked = item.liked || false;
                const comments = item.comments || [];
                html += `
                    <div class="moment-card">
                        <div class="user-info">
                            <div class="avatar">👤</div>
                            <div>
                                <div class="user-name">我</div>
                                <div class="user-time">${item.time || '刚刚'}</div>
                            </div>
                        </div>
                        <div class="moment-text">${item.text}</div>
                        ${item.img ? `<img src="${item.img}" class="moment-img" onerror="this.style.display='none'" />` : ''}
                        <div class="action-bar">
                            <span onclick="likeMoment(${index})" class="${liked ? 'liked' : ''}">
                                ${liked ? '❤️' : '🤍'} ${likeCount}
                            </span>
                            <span onclick="focusComment(${index})">💬 ${comments.length}</span>
                        </div>
                        <div class="comment-section">
                            ${comments.map(c => `<div class="comment-item">💬 ${c}</div>`).join('')}
                            <div class="comment-input-group">
                                <input id="commentInput_${index}" placeholder="写评论..." />
                                <button onclick="addComment(${index})">发送</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function addMoment() {
            const text = document.getElementById('postContent').value.trim();
            const img = document.getElementById('postImage').value.trim();
            if (!text) {
                showToast('请写点内容再发布');
                return;
            }
            const data = getData();
            data.unshift({
                text: text,
                img: img,
                time: new Date().toLocaleString('zh-CN', { hour12: false }),
                likes: 0,
                liked: false,
                comments: []
            });
            saveData(data);
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            render();
            showToast('✅ 发布成功');
        }

        function likeMoment(index) {
            const data = getData();
            if (index < 0 || index >= data.length) return;
            data[index].liked = !data[index].liked;
            data[index].likes = (data[index].likes || 0) + (data[index].liked ? 1 : -1);
            saveData(data);
            render();
        }

        function addComment(index) {
            const input = document.getElementById(`commentInput_${index}`);
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                showToast('请输入评论内容');
                return;
            }
            const data = getData();
            if (index < 0 || index >= data.length) return;
            if (!data[index].comments) data[index].comments = [];
            data[index].comments.push(val);
            saveData(data);
            render();
            showToast('💬 评论成功');
        }

        function focusComment(index) {
            setTimeout(() => {
                const input = document.getElementById(`commentInput_${index}`);
                if (input) input.focus();
            }, 200);
        }

        // 页面加载渲染
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
  </html>
